name: Update official race schedule

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'f1-schedule-starter/*.py'
      - 'f1-schedule-starter/requirements*.txt'
      - '.github/workflows/update-schedule.yml'

permissions:
  contents: write

concurrency:
  group: update-race-schedule
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: f1-schedule-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run parser and API tests
        run: python -m unittest -v
      - name: Collect calendar and session times
        env:
          F1_SEASON: ${{ vars.F1_SEASON || '2026' }}
        run: python scrape_schedule.py --year "$F1_SEASON"
      - name: Save updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json data/*.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update official race schedule and session times'
            git push
          fi
